<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API da Loja</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main>
        <h1>API da Loja</h1>

        <section>
            <h2>Produtos</h2>

            <h3>Buscar por nome</h3>
            <input type="text" id="termo-produtos" placeholder="Nome do produto">
            <button id="buscar-produtos" type="button">Buscar</button>
            <p id="status-produtos"></p>
            <ul id="resultados-produtos"></ul>

            <div id="paginacao-produtos" hidden>
                <button id="anterior-produtos" type="button">Anterior</button>
                <span id="pagina-produtos">Página 1</span>
                <button id="proxima-produtos" type="button">Próxima</button>
            </div>

            <h3>Buscar por ID</h3>
            <input type="number" id="id-produto" placeholder="ID do produto">
            <button id="buscar-produto-id" type="button">Buscar</button>
            <p id="resultado-produto-id"></p>
        </section>

        <section>
            <h2>Usuários</h2>

            <h3>Buscar por nome</h3>
            <input type="text" id="termo-usuarios" placeholder="Nome do usuário">
            <button id="buscar-usuarios" type="button">Buscar</button>
            <p id="status-usuarios"></p>
            <ul id="resultados-usuarios"></ul>

            <div id="paginacao-usuarios" hidden>
                <button id="anterior-usuarios" type="button">Anterior</button>
                <span id="pagina-usuarios">Página 1</span>
                <button id="proxima-usuarios" type="button">Próxima</button>
            </div>

            <h3>Buscar usuário por ID</h3>
            <input type="number" id="id-usuario" placeholder="ID do usuário">
            <button id="buscar-usuario-id" type="button">Buscar</button>
            <p id="resultado-usuario-id"></p>
        </section>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
