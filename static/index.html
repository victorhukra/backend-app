<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API da Loja</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main>
        <h1>API da Loja</h1>

        <section aria-labelledby="titulo-conta">
            <h2 id="titulo-conta">Minha conta</h2>
            <p id="status-sessao" role="status" aria-live="polite">Verificando sessão...</p>
            <button id="sair-conta" type="button" hidden>Sair</button>

            <div class="formularios-conta">
                <form id="form-cadastro" class="form-conta">
                    <h3>Criar usuário</h3>
                    <label for="nome-cadastro">Nome</label>
                    <input id="nome-cadastro" name="nome" type="text" maxlength="100" autocomplete="name" required>

                    <label for="email-cadastro">E-mail</label>
                    <input id="email-cadastro" name="email" type="email" maxlength="150" autocomplete="email" required>

                    <label for="senha-cadastro">Senha</label>
                    <input id="senha-cadastro" name="senha" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>

                    <p id="status-cadastro" class="status-form" role="status" aria-live="polite"></p>
                    <button type="submit">Criar conta</button>
                </form>

                <form id="form-login" class="form-conta">
                    <h3>Entrar</h3>
                    <label for="email-login">E-mail</label>
                    <input id="email-login" name="email" type="email" maxlength="150" autocomplete="username" required>

                    <label for="senha-login">Senha</label>
                    <input id="senha-login" name="senha" type="password" autocomplete="current-password" required>

                    <p id="status-login" class="status-form" role="status" aria-live="polite"></p>
                    <button type="submit">Entrar</button>
                </form>
            </div>
        </section>

        <section>
            <h2>Produtos</h2>

            <h3>Cadastrar produto</h3>
            <p id="aviso-login-produto">Entre na sua conta para cadastrar produtos.</p>
            <form id="form-cadastro-produto" class="form-conta" hidden>
                <label for="nome-produto-cadastro">Nome</label>
                <input id="nome-produto-cadastro" name="nome" type="text" maxlength="150" required>

                <label for="descricao-produto-cadastro">Descrição</label>
                <textarea id="descricao-produto-cadastro" name="descricao" maxlength="10000" rows="4"></textarea>

                <label for="preco-produto-cadastro">Preço (R$)</label>
                <input id="preco-produto-cadastro" name="preco" type="number" min="0.01" max="99999999.99" step="0.01" required>

                <p id="status-cadastro-produto" class="status-form" role="status" aria-live="polite"></p>
                <button type="submit">Cadastrar produto</button>
            </form>

            <h3>Buscar por nome</h3>
            <input type="text" id="termo-produtos" placeholder="Nome do produto">
            <button id="buscar-produtos" type="button">Buscar</button>
            <p id="status-produtos"></p>
            <ul id="resultados-produtos"></ul>

            <div id="paginacao-produtos" hidden>
                <button id="anterior-produtos" type="button">Anterior</button>
                <span id="pagina-produtos">Página 1</span>
                <button id="proxima-produtos" type="button">Próxima</button>
            </div>

            <h3>Buscar por ID</h3>
            <input type="number" id="id-produto" placeholder="ID do produto">
            <button id="buscar-produto-id" type="button">Buscar</button>
            <p id="resultado-produto-id"></p>
        </section>

        <section>
            <h2>Usuários</h2>

            <h3>Buscar por nome</h3>
            <input type="text" id="termo-usuarios" placeholder="Nome do usuário">
            <button id="buscar-usuarios" type="button">Buscar</button>
            <p id="status-usuarios"></p>
            <ul id="resultados-usuarios"></ul>

            <div id="paginacao-usuarios" hidden>
                <button id="anterior-usuarios" type="button">Anterior</button>
                <span id="pagina-usuarios">Página 1</span>
                <button id="proxima-usuarios" type="button">Próxima</button>
            </div>

            <h3>Buscar usuário por ID</h3>
            <input type="number" id="id-usuario" placeholder="ID do usuário">
            <button id="buscar-usuario-id" type="button">Buscar</button>
            <p id="resultado-usuario-id"></p>
        </section>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
